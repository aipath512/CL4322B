name: Sync EVA FAQ from C4322B
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eva-faq-auto-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate validated source FAQ
        run: node tools/sync-eva-faq.mjs
      - name: Run regression tests
        run: node --test tests/eva-hybrid.test.mjs
      - name: Commit changed FAQ only
        run: |
          if git diff --quiet -- functions/api/_faq_sync.js; then
            echo "No FAQ changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/_faq_sync.js
          git commit -m "chore(eva): sync validated 500 FAQ from C4322B"
          git push origin HEAD:main
